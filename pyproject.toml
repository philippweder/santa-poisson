[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "scipy",
  "shapely>=2",
  "gmsh",
  "matplotlib",
  "pillow",
  "pyvista",
  "trame-pyvista",
]

[tool.hatch.build.targets.wheel]
packages = ["advent"]

[tool.hatch.build.targets.sdist]
include = ["/advent", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
